[package]
name = "ddnet-accounts-bridge"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
publish = false
license = "Zlib"

[lib]
path = "lib.rs"

[dependencies]
anyhow = "1"
ddnet-account-client = "0.3"
ddnet-account-client-http-fs = "0.4"
ddnet-account-client-reqwest = "0.4"
ddnet-account-game-server = { version = "0.4", default-features = false, features = ["sqlite"] }
ddnet-account-sql = { version = "0.4", default-features = false, features = ["sqlite"] }
ddnet-accounts-shared = "0.3"
ddnet-accounts-types = "0.2"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
email_address = "0.2"
parking_lot = "0.12"
rand = { version = "0.8", default-features = false, features = ["getrandom"] }
rcgen = "0.14"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "fs"] }
url = "2"
x509-cert = "0.2"

cxx = { workspace = true }

[dev-dependencies]
reqwest = "0.13"
